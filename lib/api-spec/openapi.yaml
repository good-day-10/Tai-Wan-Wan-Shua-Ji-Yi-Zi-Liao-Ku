openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: archive
    description: Shared memory archive operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /archive:
    get:
      operationId: getArchive
      tags: [archive]
      summary: Get the shared memory archive
      responses:
        "200":
          description: Shared archive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Archive"
        "404":
          description: Archive has not been saved yet
    put:
      operationId: saveArchive
      tags: [archive]
      summary: Save the shared memory archive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveArchiveRequest"
      responses:
        "200":
          description: Saved shared archive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Archive"
        "400":
          description: Invalid archive data
        "401":
          description: Invalid editor password
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Memory:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        location:
          type: string
        era:
          type: string
        category:
          type: string
        storyteller:
          type: string
        excerpt:
          type: string
        story:
          type: string
        storyHtml:
          type: string
        color:
          type: string
        mark:
          type: string
        image:
          type: string
        images:
          type: array
          items:
            type: string
      required:
        - id
        - title
        - location
        - era
        - category
        - storyteller
        - excerpt
        - story
        - color
        - mark
    Archive:
      type: object
      properties:
        introduction:
          type: string
        memories:
          type: array
          items:
            $ref: "#/components/schemas/Memory"
        siteContent:
          $ref: "#/components/schemas/SiteContent"
      required:
        - introduction
        - memories
    SiteTextBlock:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        section:
          type: string
        html:
          type: string
        x:
          type: number
        y:
          type: number
        width:
          type: number
        align:
          type: string
      required:
        - id
        - label
        - section
        - html
        - x
        - y
        - width
        - align
    SiteContent:
      type: object
      properties:
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/SiteTextBlock"
      required:
        - blocks
    SaveArchiveRequest:
      type: object
      properties:
        editorPassword:
          type: string
        archive:
          $ref: "#/components/schemas/Archive"
      required:
        - editorPassword
        - archive


openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: archive
    description: Shared memory archive operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /archive:
    get:
      operationId: getArchive
      tags: [archive]
      summary: Get the shared memory archive
      responses:
        "200":
          description: Shared archive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Archive"
        "404":
          description: Archive has not been saved yet
    put:
      operationId: saveArchive
      tags: [archive]
      summary: Save the shared memory archive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveArchiveRequest"
      responses:
        "200":
          description: Saved shared archive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Archive"
        "400":
          description: Invalid archive data
        "401":
          description: Authentication or editor access required
        "409":
          description: Archive was changed by another editor
  /archive-copy:
    get:
      operationId: getArchiveCopy
      tags: [archive]
      summary: Get the independent archive copy
      description: Initializes the copy from the main archive on first read, then returns its independent data.
      responses:
        "200":
          description: Independent archive copy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Archive"
        "404":
          description: Source archive has not been saved yet
    put:
      operationId: saveArchiveCopy
      tags: [archive]
      summary: Save the independent archive copy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveArchiveRequest"
      responses:
        "200":
          description: Saved independent archive copy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Archive"
        "400":
          description: Invalid archive data
        "401":
          description: Authentication or editor access required
        "409":
          description: Archive copy was changed by another editor
  /archive/resonance:
    get:
      operationId: getMemoryResonance
      tags: [archive]
      summary: Get resonance counts for memories
      responses:
        "200":
          description: Resonance counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryResonanceList"
  /archive/resonance/{memoryId}:
    post:
      operationId: addMemoryResonance
      tags: [archive]
      summary: Add one visitor resonance for a memory
      parameters:
        - name: memoryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryResonanceInput"
      responses:
        "200":
          description: Updated resonance count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryResonanceResult"
        "400":
          description: Invalid reaction
        "404":
          description: Memory not found
    delete:
      operationId: removeMemoryResonance
      tags: [archive]
      summary: Remove one visitor resonance for a memory
      parameters:
        - name: memoryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryResonanceInput"
      responses:
        "200":
          description: Updated resonance count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryResonanceResult"
        "400":
          description: Invalid reaction
        "404":
          description: Memory not found
  /archive/submissions/public:
    get:
      operationId: getPublicMemoryContributions
      tags: [archive]
      summary: List pending public memory contributions
      responses:
        "200":
          description: Contributions published with a pending review label
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicMemorySubmission"
  /archive/submissions:
    post:
      operationId: submitMemoryContribution
      tags: [archive]
      summary: Submit a memory for editorial review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemorySubmissionInput"
      responses:
        "201":
          description: Contribution submitted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemorySubmissionReceipt"
        "400":
          description: Invalid contribution
    get:
      operationId: getPendingMemoryContributions
      tags: [archive]
      summary: List contributions awaiting editor review
      responses:
        "200":
          description: Pending contributions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemorySubmission"
        "401":
          description: Editor access required
  /archive/submissions/{submissionId}/approve:
    post:
      operationId: approveMemoryContribution
      tags: [archive]
      summary: Approve a contribution and add it to the archive
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveMemoryContributionInput"
      responses:
        "200":
          description: Updated shared archive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Archive"
        "401":
          description: Editor access required
        "409":
          description: Archive changed; reload before approving
  /archive/submissions/{submissionId}/reject:
    post:
      operationId: rejectMemoryContribution
      tags: [archive]
      summary: Reject a contribution
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Contribution rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemorySubmissionReceipt"
        "401":
          description: Editor access required
  /storage/uploads/request-url:
    post:
      operationId: requestArchiveImageUploadUrl
      tags: [archive]
      summary: Request a presigned upload URL for a memory photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "401":
          description: Sign in before uploading a photo
  /storage/objects/{objectPath}:
    get:
      operationId: getArchiveImage
      tags: [archive]
      summary: Serve a memory archive image
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Uploaded image bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Image not found
  /editor/unlock:
    post:
      operationId: unlockEditor
      tags: [archive]
      summary: Unlock archive editing for the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditorUnlockRequest"
      responses:
        "200":
          description: Editor access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorUnlockResponse"
        "400":
          description: Invalid editor credentials
        "401":
          description: Authentication or editor credentials required
        "503":
          description: Editor access is not configured
  /editor-copy/unlock:
    post:
      operationId: unlockArchiveCopyEditor
      tags: [archive]
      summary: Unlock editing for the independent archive copy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditorUnlockRequest"
      responses:
        "200":
          description: Editor access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorUnlockResponse"
        "400":
          description: Invalid editor credentials
        "401":
          description: Authentication or editor credentials required
        "503":
          description: Editor access is not configured
  /editor/status:
    get:
      operationId: getEditorStatus
      tags: [archive]
      summary: Check the current editor access role
      responses:
        "200":
          description: Current authentication and owner status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorStatus"
  /editor-copy/status:
    get:
      operationId: getArchiveCopyEditorStatus
      tags: [archive]
      summary: Check the current editor role for the independent archive copy
      responses:
        "200":
          description: Current authentication and owner status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Memory:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        location:
          type: string
        era:
          type: string
        category:
          type: string
        storyteller:
          type: string
        excerpt:
          type: string
        story:
          type: string
        storyHtml:
          type: string
        color:
          type: string
        mark:
          type: string
        image:
          type: string
        images:
          type: array
          items:
            type: string
      required:
        - id
        - title
        - location
        - era
        - category
        - storyteller
        - excerpt
        - story
        - color
        - mark
    Archive:
      type: object
      properties:
        version:
          type: integer
          format: int32
          minimum: 1
          description: Monotonically increasing server revision used for optimistic concurrency checks
        introduction:
          type: string
        memories:
          type: array
          items:
            $ref: "#/components/schemas/Memory"
        siteContent:
          $ref: "#/components/schemas/SiteContent"
      required:
        - introduction
        - memories
    SiteTextBlock:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        section:
          type: string
        html:
          type: string
        x:
          type: number
        y:
          type: number
        width:
          type: number
        align:
          type: string
      required:
        - id
        - label
        - section
        - html
        - x
        - y
        - width
        - align
    SiteContent:
      type: object
      properties:
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/SiteTextBlock"
        pages:
          type: array
          items:
            $ref: "#/components/schemas/CustomPage"
      required:
        - blocks
    MemoryResonance:
      type: object
      properties:
        memoryId:
          type: string
        count:
          type: integer
          minimum: 0
      required: [memoryId, count]
    MemoryResonanceList:
      type: array
      items:
        $ref: "#/components/schemas/MemoryResonance"
    MemoryResonanceInput:
      type: object
      properties:
        visitorId:
          type: string
          minLength: 8
          maxLength: 80
      required: [visitorId]
    MemoryResonanceResult:
      type: object
      properties:
        memoryId:
          type: string
        count:
          type: integer
          minimum: 0
        alreadyReacted:
          type: boolean
      required: [memoryId, count, alreadyReacted]
    MemorySubmissionInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        category:
          type: string
          minLength: 1
          maxLength: 80
        era:
          type: string
          minLength: 1
          maxLength: 80
        story:
          type: string
          minLength: 10
          maxLength: 10000
        name:
          type: string
          maxLength: 120
        gender:
          type: string
          enum: [女性, 男性, 其他, 不透露]
        imagePath:
          type: string
          maxLength: 500
      required: [title, category, era, story]
    MemorySubmission:
      allOf:
        - $ref: "#/components/schemas/MemorySubmissionInput"
        - type: object
          properties:
            id:
              type: string
            status:
              type: string
              enum: [pending, rejected]
            createdAt:
              type: string
              format: date-time
          required: [id, status, createdAt]
    MemorySubmissionReceipt:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, rejected]
      required: [id, status]
    PublicMemorySubmission:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        category:
          type: string
        era:
          type: string
        story:
          type: string
        imagePath:
          type: ["string", "null"]
      required: [id, title, category, era, story]
    ApproveMemoryContributionInput:
      type: object
      properties:
        expectedVersion:
          type: integer
          minimum: 1
      required: [expectedVersion]
    UploadUrlRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        size:
          type: integer
          minimum: 1
          maximum: 10485760
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
      required: [name, size, contentType]
    UploadUrlResponse:
      type: object
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
      required: [uploadURL, objectPath]
    CustomPage:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string
        backgroundImage:
          type: string
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/SiteTextBlock"
      required:
        - id
        - title
        - slug
        - blocks
    SaveArchiveRequest:
      type: object
      properties:
        archive:
          $ref: "#/components/schemas/Archive"
        expectedVersion:
          type: integer
          format: int32
          minimum: 1
          description: Server revision read by the editor before it started editing
      required:
        - archive
    EditorUnlockRequest:
      type: object
      properties:
        editorPassword:
          type: string
      required:
        - editorPassword
    EditorUnlockResponse:
      type: object
      properties:
        unlocked:
          type: boolean
      required:
        - unlocked
    EditorStatus:
      type: object
      properties:
        authenticated:
          type: boolean
        owner:
          type: boolean
      required:
        - authenticated
        - owner


name: Archive integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-integration:
    name: Archive login and save checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: archive_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d archive_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CLERK_SECRET_KEY: ${{ secrets.ARCHIVE_TEST_CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.ARCHIVE_TEST_CLERK_PUBLISHABLE_KEY }}
      ARCHIVE_EDITOR_PASSWORD: ${{ secrets.ARCHIVE_TEST_EDITOR_PASSWORD }}
      ARCHIVE_TEST_BASE_URL: http://127.0.0.1:3001/api
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/archive_test
      PORT: "3001"
      SESSION_SECRET: archive-integration-ci-session-secret
      ARCHIVE_TEST_USER_EMAIL: archive-integration-test@example.com

    steps:
      - name: Check required test configuration
        shell: bash
        run: |
          missing=()
          [[ -n "${CLERK_SECRET_KEY:-}" ]] || missing+=("ARCHIVE_TEST_CLERK_SECRET_KEY")
          [[ -n "${CLERK_PUBLISHABLE_KEY:-}" ]] || missing+=("ARCHIVE_TEST_CLERK_PUBLISHABLE_KEY")
          [[ -n "${ARCHIVE_EDITOR_PASSWORD:-}" ]] || missing+=("ARCHIVE_TEST_EDITOR_PASSWORD")
          [[ -n "${ARCHIVE_TEST_BASE_URL:-}" ]] || missing+=("ARCHIVE_TEST_BASE_URL")
          [[ -n "${DATABASE_URL:-}" ]] || missing+=("DATABASE_URL")

          if (( ${#missing[@]} > 0 )); then
            printf 'Archive integration CI is missing required settings: %s.\n' "$(IFS=', '; echo "${missing[*]}")" >&2
            exit 1
          fi

          if [[ "$CLERK_SECRET_KEY" != sk_test_* ]]; then
            echo "Archive integration CI requires ARCHIVE_TEST_CLERK_SECRET_KEY to be a Clerk test-instance key." >&2
            exit 1
          fi
          if [[ "$CLERK_PUBLISHABLE_KEY" != pk_test_* ]]; then
            echo "Archive integration CI requires ARCHIVE_TEST_CLERK_PUBLISHABLE_KEY to be a Clerk test-instance key." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Create the archive test schema and fixture
        run: |
          pnpm --filter @workspace/db run push
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "INSERT INTO archive (id, introduction, memories, revision) VALUES ('main', 'CI archive fixture', '[]'::jsonb, 1)"

      - name: Build and start the API server
        run: |
          pnpm --filter @workspace/api-server run build
          nohup pnpm --filter @workspace/api-server run start > /tmp/archive-api-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/api/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Archive integration API server did not become ready." >&2
          tail -n 100 /tmp/archive-api-server.log >&2
          exit 1

      - name: Run archive login and save integration checks
        run: pnpm --filter @workspace/taiwan-memory-archive run test:archive-integration:ci

kind = "web"
previewPath = "/memory-archive-copy/"
title = "台灣玩耍記憶資料庫｜新站副本"
description = "以目前台灣玩耍記憶資料庫為基礎建立的獨立網站副本，保留公開瀏覽、登入與編輯、共享資料同步及內容管理功能，並使用獨立的資料集。"
version = "1.0.0"
id = "artifacts/memory-archive-copy"
router = "path"

[[services]]
name = "web"
paths = [ "/memory-archive-copy/" ]
localPort = 23896

[services.development]
run = "pnpm --filter @workspace/memory-archive-copy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/memory-archive-copy", "run", "build" ]
serve = "static"
publicDir = "artifacts/memory-archive-copy/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23896"
BASE_PATH = "/memory-archive-copy/"
